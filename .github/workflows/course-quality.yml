name: Course Quality Checks

on:
  push:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  course-quality:
    name: Check course structure and Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run course quality checker
        run: python scripts/check_course_quality.py
